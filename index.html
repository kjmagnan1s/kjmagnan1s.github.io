---
layout: default
title: Home
---

<!-- Hero Section -->
<section class="hero">
    <div class="hero-background"></div>
    <div class="hero-content">
        <h1>Kevin J. Magnan</h1>
        <p class="description">Leading Slalom's efforts to build safer AI for the Justice & Public Safety industries.</p>

        <!-- Chat Interface -->
        <div class="chat-container">
            <div id="chat-messages"></div>
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="Type your message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
</section>

<!-- Cookie Consent Banner -->
<div id="cookie-consent" class="cookie-consent">
    <div class="cookie-content">
        <p>This website uses cookies to ensure you get the best experience. <a href="/privacy">Learn more</a></p>
        <button id="accept-cookies" class="cookie-button">Accept</button>
    </div>
</div>

<!-- Back to Top Button -->
<button id="back-to-top" class="back-to-top" aria-label="Back to top">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 15l-6-6-6 6"/>
    </svg>
</button>

<style>
/* Hero Section Styles */
.hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
    color: var(--background-color);
    padding: 2rem;
    padding-top: 4rem;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.hero-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
    z-index: -1;
}

.hero-content {
    max-width: 800px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
}

.hero h1 {
    font-size: 3.5rem;
    margin-bottom: 1rem;
    font-weight: 700;
    color: var(--background-color);
    animation: fadeInDown 1s ease-out;
}

.subtitle {
    font-size: 1.5rem;
    margin-bottom: 1.5rem;
    color: var(--background-color);
    opacity: 0.9;
    animation: fadeInUp 1s ease-out 0.3s both;
}

.description {
    font-size: 1.2rem;
    margin-bottom: 2rem;
    color: var(--background-color);
    opacity: 0.8;
    animation: fadeInUp 1s ease-out 0.6s both;
}

/* Chat Interface Styles */
.chat-container {
    max-width: 600px;
    margin: 20px auto;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

#chat-messages {
    height: 300px;
    overflow-y: auto;
    margin-bottom: 10px;
    padding: 10px;
    border: 1px solid #eee;
}

.chat-input {
    display: flex;
    gap: 10px;
}

#user-input {
    flex: 1;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

button {
    padding: 8px 16px;
    background-color: #1a365d;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

button:hover {
    background-color: #2c5282;
}

/* Message Styles */
.message {
    margin-bottom: 1rem;
    padding: 0.8rem 1rem;
    border-radius: 10px;
    max-width: 80%;
    transition: all 0.3s ease;
}

.user-message {
    background: rgba(255, 255, 255, 0.2);
    margin-left: auto;
    border: 1px solid rgba(255, 255, 255, 0.3);
}

.bot-message {
    background: rgba(255, 255, 255, 0.1);
    margin-right: auto;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.typing {
    opacity: 0.7;
    font-style: italic;
}

/* Animations */
@keyframes fadeInDown {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Responsive Design */
@media (max-width: 768px) {
    .hero h1 {
        font-size: 2.5rem;
    }
    
    .subtitle {
        font-size: 1.2rem;
    }
    
    .description {
        font-size: 1rem;
    }
    
    .chat-container {
        padding: 1.5rem;
    }
    
    .chat-input {
        flex-direction: column;
    }
    
    #user-input {
        width: 100%;
    }
}

/* Cookie Consent Styles */
.cookie-consent {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0, 0, 0, 0.9);
    color: white;
    padding: 1rem;
    display: none;
    z-index: 1000;
}

.cookie-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
}

.cookie-content p {
    margin: 0;
    font-size: 0.9rem;
}

.cookie-content a {
    color: var(--primary-color);
    text-decoration: underline;
}

.cookie-button {
    background: var(--primary-color);
    color: white;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.3s ease;
}

.cookie-button:hover {
    background: var(--secondary-color);
}

/* Back to Top Button Styles */
.back-to-top {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: var(--primary-color);
    color: white;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    z-index: 999;
}

.back-to-top:hover {
    background: var(--secondary-color);
    transform: translateY(-3px);
}

.back-to-top svg {
    width: 20px;
    height: 20px;
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .cookie-content {
        flex-direction: column;
        text-align: center;
    }
    
    .back-to-top {
        bottom: 1rem;
        right: 1rem;
    }
}
</style>

<script>
// Cookie Consent
document.addEventListener('DOMContentLoaded', function() {
    // Show initial greeting
    const chatMessages = document.getElementById('chat-messages');
    const welcomeMessage = document.createElement('div');
    welcomeMessage.className = 'message assistant';
    welcomeMessage.textContent = 'Hello! I\'m here to help you learn more about Kevin\'s work in data analytics and business intelligence. How can I assist you today?';
    chatMessages.appendChild(welcomeMessage);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    const cookieConsent = document.getElementById('cookie-consent');
    const acceptButton = document.getElementById('accept-cookies');
    
    if (!localStorage.getItem('cookiesAccepted')) {
        cookieConsent.style.display = 'block';
    }
    
    acceptButton.addEventListener('click', function() {
        localStorage.setItem('cookiesAccepted', 'true');
        cookieConsent.style.display = 'none';
    });
});

// Back to Top Button
document.addEventListener('DOMContentLoaded', function() {
    const backToTopButton = document.getElementById('back-to-top');
    
    window.addEventListener('scroll', function() {
        if (window.pageYOffset > 300) {
            backToTopButton.style.display = 'flex';
        } else {
            backToTopButton.style.display = 'none';
        }
    });
    
    backToTopButton.addEventListener('click', function() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    });
});

async function sendMessage() {
    const input = document.getElementById('user-input');
    const message = input.value.trim();
    if (!message) return;

    // Add user message to chat
    addMessage('user', message);
    input.value = '';

    try {
        const response = await fetch('https://tubular-torte-6b51ae.netlify.app/.netlify/functions/chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            mode: 'cors',
            credentials: 'omit',
            body: JSON.stringify({ message }),
        });

        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        
        if (data.error) {
            throw new Error(data.error);
        }

        if (data.reply) {
            addMessage('assistant', data.reply);
        } else {
            throw new Error('No reply received from the server');
        }
    } catch (error) {
        console.error('Error:', error);
        addMessage('assistant', 'Sorry, there was an error processing your message. Please try again later.');
    }
}

function addMessage(role, content) {
    const chatMessages = document.getElementById('chat-messages');
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${role}`;
    messageDiv.textContent = content;
    chatMessages.appendChild(messageDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

// Allow sending message with Enter key
document.getElementById('user-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        sendMessage();
    }
});
</script>
