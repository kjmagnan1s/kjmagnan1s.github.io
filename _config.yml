title: Kevin J. Magnan
email: kjmagnan1s@gmail.com
description: >-
  Shaping how the public sector adopts AI. Responsibly, ethically, and at scale. Principal Consultant at Slalom, bringing on-the-ground public servant experience to AI strategy and implementation.
baseurl: ""
url: "https://kevinjmagnan.com"

theme: minima

markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

collections:
  posts:
    output: true

# Permalink structure for blog posts
permalink: /:year/:month/:day/:title.html

sass:
  style: compressed
  sass_dir: _sass

include:
  - assets/css/custom.css

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
