[build]
  functions = "netlify/functions"
  publish = "_site"
  command = "bundle install && bundle exec jekyll build && mkdir -p _site/.well-known/agent-skills/about-kevin && cp .well-known/agent-skills/about-kevin/SKILL.md _site/.well-known/agent-skills/about-kevin/SKILL.md && cd netlify/functions && npm install"

[functions]
  node_bundler = "esbuild"

[build.environment]
  RUBY_VERSION = "3.1.0"
  NODE_VERSION = "18"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# Redirect /c/* to /c/index.html for custom conversation pages
[[redirects]]
  from = "/c/*"
  to = "/c/index.html"
  status = 200
  force = true