<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | Kevin Magnan</title>
  <meta name="description" content="{{ page.description | escape }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="icon" href="/assets/brand/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/resources.css">
  <style>
    /* Map the old stone-and-copper tokens onto the site's navy and paper, and
       style the shared header and footer (same rules as assets/css/v2.css). */
    .resource-page {
      --text-primary: #f3e6d3; --text-secondary: #cdbfae; --text-muted: #a99c8c;
      --bg-page: #071a31; --bg-section: #0b2340; --accent: #e0662a; --accent-hover: #f07a3e;
      --border: rgba(243,230,211,.18); --copper-400: #e0662a; --copper-300: #f08a55;
      --stone-700: rgba(243,230,211,.18); --guide-line: rgba(243,230,211,.2);
      background: #071a31; color: #f3e6d3;
    }
    .resource-page .nav { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 24px clamp(16px, 5vw, 64px); font-size: .95rem; max-width: 1240px; margin: 0 auto; }
    .resource-page .nav a { color: #f3e6d3; text-decoration: none; opacity: .9; }
    .resource-page .nav a:hover { opacity: 1; }
    .resource-page .nav-links { display: flex; flex-wrap: wrap; gap: 8px clamp(16px, 3vw, 32px); }
    .resource-page .nav-mark { font-family: var(--font-heading); font-weight: 600; letter-spacing: -.01em; }
    .resource-page .site-foot { padding: 32px clamp(16px, 5vw, 64px) 48px; max-width: 1240px; margin: 48px auto 0; display: flex; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; color: #cdbfae; font-size: .9rem; }
    .resource-page .site-foot a { color: #cdbfae; }
    .resource-page .foot-links { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  </style>
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}/assets/images/web_thumbnail.png">
</head>
<body class="resource-page">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include site-nav.html %}
  <main id="main" class="resource-main">{{ content }}</main>
  {% include site-footer.html %}
  <script src="/assets/js/resources.js" defer></script>
</body>
</html>
