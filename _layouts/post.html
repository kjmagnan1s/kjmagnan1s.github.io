---
layout: default
---

<article class="post-page">
    <header class="post-header">
        <h1>{{ page.title }}</h1>
        <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
    </header>

    <div class="post-content">
        {{ content }}
    </div>

    <footer class="post-nav">
        <a href="{{ '/blog' | relative_url }}">&larr; All writing</a>
    </footer>
</article>
