---
layout: default
---
<header class="band band-navy">
  {% include site-nav.html %}
  <div class="wrap wrap-top wrap-read">
    <p class="eyebrow"><a href="/blog/">Writing</a> · {{ page.date | date: "%B %-d, %Y" }}</p>
    <h1 class="display display-post">{{ page.title }}</h1>
  </div>
</header>

<main class="band band-paper">
  <article class="wrap wrap-read">
    <div class="prose">
      {{ content }}
    </div>
    <p class="back"><a href="/blog/">&larr; All writing</a></p>
  </article>
</main>

<div class="band band-navy">
  {% include site-footer.html %}
</div>
