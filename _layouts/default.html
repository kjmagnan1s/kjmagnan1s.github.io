<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | truncate: 160 }}">

    <!-- Favicon -->
    <link rel="shortcut icon" href="{{ '/assets/brand/favicon-32.png' | relative_url }}" type="image/png">
    <link rel="icon" href="{{ '/assets/brand/favicon-32.png' | relative_url }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ '/assets/brand/apple-touch-icon.png' | relative_url }}">
    <meta name="theme-color" content="#071a31">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">

    <!-- Styles. site.css carries the footer sitemap and /building styles. -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/conversation.css' | relative_url }}">
    {% if page.url == '/' %}
    <!-- Built by `npm run build:shell` (vite). Styles the generative shell, so
         the idle front page is correct before any JavaScript runs. -->
    <link rel="stylesheet" href="{{ '/assets/genui/genui.css' | relative_url }}">
    {% endif %}

    <!-- Canonical -->
    <link rel="canonical" href="{{ site.url }}{{ page.url }}">

    {% seo %}
</head>
<body{% if page.url == '/' %} class="shell-page" data-shell="idle"{% endif %}>
    {% include nav.html %}

    <main class="site-main">
        {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/conversation.js' | relative_url }}"></script>
</body>
</html>
