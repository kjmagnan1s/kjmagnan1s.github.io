<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | truncate: 160 }}">

    <!-- Favicon -->
    <link rel="shortcut icon" href="{{ '/assets/images/favicon_v2.png' | relative_url }}" type="image/png">
    <link rel="icon" href="{{ '/assets/images/favicon_v2.png' | relative_url }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ '/assets/images/favicon_v2.png' | relative_url }}">
    <meta name="theme-color" content="#B87333">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

    <!-- Canonical -->
    <link rel="canonical" href="{{ site.url }}{{ page.url }}">

    {% seo %}
</head>
<body>
    {% unless page.layout == 'home' or page.url == '/' %}
    <header class="site-header">
        <a href="{{ '/' | relative_url }}" class="site-logo">Kevin Magnan</a>
        <nav class="site-nav">
            <a href="{{ '/#writing' | relative_url }}">Writing</a>
            <a href="{{ '/#work' | relative_url }}">Work</a>
            <a href="{{ '/#about' | relative_url }}">About</a>
        </nav>
    </header>
    {% endunless %}

    <main class="site-main">
        {{ content }}
    </main>

    <footer class="site-footer">
        <p>&copy; <span class="current-year">{{ 'now' | date: "%Y" }}</span> Kevin J. Magnan</p>
    </footer>

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
