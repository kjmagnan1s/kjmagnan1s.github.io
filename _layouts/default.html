<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{ page.title }} | {{ site.title }}</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="{{ '/assets/images/favicon.png' | relative_url }}" type="image/png">
    <link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ '/assets/images/favicon.png' | relative_url }}">
    <meta name="msapplication-TileImage" content="{{ '/assets/images/favicon.png' | relative_url }}">
    <meta name="theme-color" content="#1a365d">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/robot-toggle.css' | relative_url }}">
    
    <!-- Animation Library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    
    <!-- Dual View Links -->
    <link rel="alternate" href="{{ site.url }}/robot/" title="Robot version" type="text/html">
    <link rel="canonical" href="{{ site.url }}{{ page.url }}">
    
    <!-- JSON-LD Structured Data -->
    {% include jsonld.html %}
    
    {% seo %}
  </head>
  <body>
    {% include nav.html %}
    
    <main>
      {{ content }}
    </main>

    {% include footer.html %}

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
      // Initialize AOS animation library
      AOS.init({
        duration: 800,
        once: true
      });

      // Smooth scroll for anchor links
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
          e.preventDefault();
          document.querySelector(this.getAttribute('href')).scrollIntoView({
            behavior: 'smooth'
          });
        });
      });

      // Query parameter toggle for robot view
      const params = new URLSearchParams(location.search);
      const robotView = params.get("view") === "robot";
      if (robotView && !location.pathname.includes('/robot')) {
        location.replace("/robot" + location.pathname);
      }
    </script>
  </body>
</html>
