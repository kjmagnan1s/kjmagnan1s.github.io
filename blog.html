---
layout: default
title: Writing
permalink: /blog/
---

<div class="blog-page">
    <h1>Writing</h1>

    <ul class="post-list">
        {% for post in site.posts %}
        <li class="post-item">
            <a href="{{ post.url | relative_url }}" class="post-link">
                <span class="post-title">{{ post.title }}</span>
                <span class="post-meta">{{ post.date | date: "%b %Y" }}</span>
            </a>
        </li>
        {% endfor %}
    </ul>
</div>
