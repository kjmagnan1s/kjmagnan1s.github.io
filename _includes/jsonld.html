{% assign d = site.data.site %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Person",
      "@id": "{{ d.person.url }}#me",
      "name": "{{ d.person.name }}",
      "url": "{{ d.person.url }}",
      "email": "{{ d.person.email }}",
      "jobTitle": "{{ d.person.jobTitle }}",
      "description": "{{ d.person.description }}",
      "worksFor": {
        "@type": "Organization",
        "name": "{{ d.person.worksFor.name }}",
        "url": "{{ d.person.worksFor.url }}"
      },
      "sameAs": {{ d.person.sameAs | jsonify }},
      "knowsAbout": {{ d.skills | jsonify }}
    },
    {
      "@type": "ItemList",
      "@id": "{{ site.url }}/#work",
      "name": "Selected Work",
      "itemListElement": [
        {% for p in d.projects %}
        {
          "@type": "ListItem",
          "position": {{ forloop.index }},
          "item": {
            "@type": "CreativeWork",
            "@id": "{{ site.url }}{{ p.url }}",
            "name": "{{ p.name }}",
            "about": {{ p.tags | jsonify }},
            "description": "{{ p.summary | escape }}",
            "genre": "{{ p.type }}"
          }
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    },
    {
      "@type": "ItemList", 
      "@id": "{{ site.url }}/#publications",
      "name": "All Publications & Blog Posts",
      "numberOfItems": {{ site.posts.size }},
      "itemListElement": [
        {% for post in site.posts %}
        {
          "@type": "ListItem",
          "position": {{ forloop.index }},
          "item": {
            "@type": "BlogPosting",
            "@id": "{{ site.url }}{{ post.url }}",
            "headline": "{{ post.title }}",
            "datePublished": "{{ post.date | date_to_xmlschema }}",
            {% if post.description %}"description": "{{ post.description | escape }}",{% endif %}
            {% if post.categories and post.categories.size > 0 %}"keywords": {{ post.categories | jsonify }},{% endif %}
            {% if post.thumbnail %}"image": "{{ site.url }}{{ post.thumbnail }}",{% endif %}
            "author": {
              "@id": "{{ d.person.url }}#me"
            }
          }
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    }
  ]
}
</script>
{% if include.robot == "true" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "DataFeed",
  "@id": "{{ site.url }}/api/profile.json",
  "name": "Kevin Magnan Profile Feed",
  "description": "Machine-readable profile and work data",
  "dataFeedElement": [
    {"@type":"DataFeedItem","item": {"@id": "{{ d.person.url }}#me"}},
    {"@type":"DataFeedItem","item": {"@id": "{{ site.url }}/#work"}},
    {"@type":"DataFeedItem","item": {"@id": "{{ site.url }}/#publications"}}
  ]
}
</script>
{% endif %}
