<div class="chat-container" id="chatContainer">
  <div class="chat-header">
    <h3>Chat with Kevin's Website</h3>
    <button class="close-chat" id="closeChat">
      <i class="fas fa-times"></i>
    </button>
  </div>
  
  <div class="chat-messages" id="chatMessages">
    <div class="message bot">
      <div class="message-content">
        <p>Hi! I'm an AI assistant for Kevin's website. I can help you learn more about his work, experience, and projects. What would you like to know?</p>
      </div>
    </div>
  </div>
  
  <div class="chat-input-container">
    <form id="chatForm" class="chat-form">
      <input type="text" id="userInput" placeholder="Type your message here..." autocomplete="off">
      <button type="submit" class="send-button">
        <i class="fas fa-paper-plane"></i>
      </button>
    </form>
  </div>
</div>

<style>
.chat-container {
  position: relative;
  width: 100%;
  max-width: 800px;
  height: 500px;
  background: var(--background-color);
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
  display: flex;
  flex-direction: column;
  margin: 2rem auto;
  border: 1px solid var(--border-color);
}

.chat-header {
  padding: 1rem;
  background: var(--primary-color);
  color: white;
  border-radius: 12px 12px 0 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.chat-header h3 {
  margin: 0;
  font-size: 1.2rem;
}

.close-chat {
  background: none;
  border: none;
  color: white;
  cursor: pointer;
  padding: 0.5rem;
  font-size: 1.2rem;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.message {
  display: flex;
  max-width: 85%;
}

.message.user {
  align-self: flex-end;
}

.message.bot {
  align-self: flex-start;
}

.message-content {
  padding: 0.75rem 1rem;
  border-radius: 12px;
  background: var(--background-alt);
}

.message.user .message-content {
  background: var(--primary-color);
  color: white;
}

.chat-input-container {
  padding: 1rem;
  border-top: 1px solid var(--border-color);
}

.chat-form {
  display: flex;
  gap: 0.5rem;
}

#userInput {
  flex: 1;
  padding: 0.75rem;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.3s ease;
}

#userInput:focus {
  border-color: var(--primary-color);
}

.send-button {
  background: var(--primary-color);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 0.75rem 1rem;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.send-button:hover {
  background: var(--secondary-color);
}

@media (max-width: 768px) {
  .chat-container {
    height: 400px;
    margin: 1rem;
  }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const chatContainer = document.getElementById('chatContainer');
  const chatForm = document.getElementById('chatForm');
  const userInput = document.getElementById('userInput');
  const chatMessages = document.getElementById('chatMessages');

  // Handle form submission
  chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = userInput.value.trim();
    if (!message) return;

    // Add user message to chat
    addMessage(message, 'user');
    userInput.value = '';

    // Show typing indicator
    const typingIndicator = addTypingIndicator();

    try {
      // Here you would typically make an API call to your backend
      // For now, we'll simulate a response
      setTimeout(() => {
        typingIndicator.remove();
        const response = generateResponse(message);
        addMessage(response, 'bot');
      }, 1000);
    } catch (error) {
      typingIndicator.remove();
      addMessage("I'm sorry, I encountered an error. Please try again.", 'bot');
    }
  });

  function addMessage(text, sender) {
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${sender}`;
    messageDiv.innerHTML = `
      <div class="message-content">
        <p>${text}</p>
      </div>
    `;
    chatMessages.appendChild(messageDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function addTypingIndicator() {
    const typingDiv = document.createElement('div');
    typingDiv.className = 'message bot';
    typingDiv.innerHTML = `
      <div class="message-content">
        <p>Typing...</p>
      </div>
    `;
    chatMessages.appendChild(typingDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return typingDiv;
  }

  function generateResponse(message) {
    // This is a simple response generator
    // In a real implementation, you would connect this to an AI service
    const responses = {
      'hello': 'Hello! How can I help you today?',
      'hi': 'Hi there! What would you like to know about Kevin?',
      'who are you': 'I\'m an AI assistant for Kevin\'s website. I can tell you about his work, experience, and projects.',
      'what do you do': 'I can help you learn about Kevin\'s professional background, skills, and projects. Feel free to ask me anything!',
      'default': 'I understand you\'re asking about: ' + message + '. In a real implementation, this would connect to an AI service to generate a proper response.'
    };

    const lowerMessage = message.toLowerCase();
    return responses[lowerMessage] || responses['default'];
  }
});
</script>
